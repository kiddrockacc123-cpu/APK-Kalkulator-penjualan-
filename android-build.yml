name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip python3-setuptools python3-dev           build-essential git wget unzip openjdk-17-jdk zip

    - name: Install Buildozer
      run: |
        pip install --upgrade pip cython buildozer

    - name: Setup Android SDK and NDK
      env:
        ANDROID_HOME: /opt/android
      run: |
        sudo mkdir -p $ANDROID_HOME
        cd /opt
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O sdk.zip
        sudo unzip sdk.zip -d $ANDROID_HOME/cmdline-tools
        sudo mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --sdk_root=$ANDROID_HOME "platform-tools"
        yes | sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-33"
        yes | sdkmanager --sdk_root=$ANDROID_HOME "build-tools;34.0.0"
        yes | sdkmanager --sdk_root=$ANDROID_HOME "ndk;25.2.9519653"
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

    - name: Build APK
      env:
        ANDROID_HOME: /opt/android
      run: buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: apk
        path: bin/*.apk

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
